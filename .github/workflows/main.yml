
name: Build Ostath Mohammed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:   { packages: '' }
          
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q Ostath-Mohammed-Android-Project.zip

      - name: Build APK
        run: gradle -p ostath-mohammed-android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Ostath-Mohammed-APK
          path: ostath-mohammed-android/app/build/outputs/apk/debug/app-debug.apk
